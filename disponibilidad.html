<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta la disponibilidad de los espacios de MiEspacioParaCelebrar.">
  <title>Disponibilidad · MiEspacioParaCelebrar</title>
  <link rel="stylesheet" href="css/main.css?v=20261007">
  <script src="supabase-config.js?v=20261007"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/app.js?v=20261008-nav-unified"></script>
  <style>
    body[data-page="availability"] .availability-search-card {
      max-width: 760px;
      margin-inline: auto;
    }

    body[data-page="availability"] .availability-calendar-panel-wrap {
      position: relative;
    }

    body[data-page="availability"] #availability-calendar-panel {
      width: min(100%, 420px);
      margin-top: 10px;
    }

    body[data-page="availability"] .availability-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    body[data-page="availability"] #availability-results {
      margin-top: 20px;
    }

    body[data-page="availability"] #available-spaces {
      margin-top: 22px;
    }

    body[data-page="availability"] .availability-result-card-media {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--surface-soft, #edf2ed);
    }

    body[data-page="availability"] .availability-result-card-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    body[data-page="availability"] .availability-result-card-placeholder {
      min-height: 170px;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--muted, #6d756d);
      font-size: .9rem;
    }

    body[data-page="availability"] #available-spaces .card-body {
      min-width: 0;
    }

    body[data-page="availability"] #available-spaces .card-body .eyebrow {
      margin-bottom: 8px;
    }

    body[data-page="availability"] #available-spaces .card-body h3 {
      margin-bottom: 8px;
    }

    body[data-page="availability"] #available-spaces .card-body .muted {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }


    @media (max-width: 767px) {
      body[data-page="availability"] .availability-search-card {
        width: 100%;
      }

      body[data-page="availability"] .availability-actions .button {
        width: 100%;
      }
    }
  </style>
</head>
<body data-page="availability">

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="MiEspacioParaCelebrar">
      <span class="brand-mark">MiEspacioParaCelebrar</span>
    </a>

    <button class="nav-toggle"
      type="button"
      data-nav-toggle
      aria-expanded="false"
      aria-controls="main-nav">Menú</button>

    <nav id="main-nav" class="nav-links" data-nav aria-label="Navegación principal">
        <a href="espacios.html">Espacios</a>
        <a href="disponibilidad.html">Disponibilidad</a>
        <a href="seguimiento.html">Consultar</a>
        <a href="acceso.html">Área privada</a>
      </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="section-header">
        <div>
          <p class="eyebrow">DISPONIBILIDAD</p>
          <h1>Consulta tu fecha</h1>
          <p>Selecciona una fecha o un intervalo para buscar espacios disponibles.</p>
        </div>
      </div>

      <div class="panel availability-search-card">
        <form id="availability-form" novalidate>
          <input type="hidden" id="start-date" name="start-date">
          <input type="hidden" id="end-date" name="end-date">

          <div class="form-grid">
            <div class="form-field date-input-wrap">
              <label for="availability-start-calendar-button">Desde</label>
              <button
                id="availability-start-calendar-button"
                class="date-input-button"
                type="button"
                aria-haspopup="dialog"
                aria-controls="availability-calendar-panel">
                <span id="start-date-display">Selecciona una fecha</span>
                <span aria-hidden="true">▾</span>
              </button>
            </div>

            <div class="form-field date-input-wrap">
              <label for="availability-end-calendar-button">Hasta</label>
              <button
                id="availability-end-calendar-button"
                class="date-input-button"
                type="button"
                aria-haspopup="dialog"
                aria-controls="availability-calendar-panel">
                <span id="end-date-display">Selecciona una fecha</span>
                <span aria-hidden="true">▾</span>
              </button>
            </div>
          </div>

          <div class="availability-calendar-panel-wrap">
            <div
              id="availability-calendar-panel"
              class="calendar-panel"
              role="dialog"
              aria-label="Calendario de disponibilidad"
              hidden></div>
          </div>

          <div class="availability-actions">
            <button class="button button-primary" type="submit">
              Buscar espacios disponibles
            </button>
            <button class="button button-secondary" type="reset">
              Limpiar
            </button>
          </div>

          <div
            id="availability-results"
            class="notice"
            hidden
            aria-live="polite"></div>

          <div id="available-spaces" class="grid grid-3" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© <span data-year></span> MiEspacioParaCelebrar</p>
  </div>
</footer>

</body>
</html>
