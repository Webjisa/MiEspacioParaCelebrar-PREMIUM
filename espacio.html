<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta un espacio para celebraciones y eventos en MiEspacioParaCelebrar.">
  <title>Espacio · MiEspacioParaCelebrar</title>
  <link rel="stylesheet" href="css/main.css?v=20261008-navfix">
  <script src="supabase-config.js?v=20261008-navfix"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       FICHA DE ESPACIO · AJUSTE VISUAL PREMIUM v9
       Mantiene la ficha validada y corrige exclusivamente
       el comportamiento del menú en móvil.
    ========================================================= */
    body[data-page="space"] .site-header .brand-mark {
      display:inline-flex;
      align-items:center;
      color:var(--text);
      font-size:1.08rem;
      font-weight:850;
      letter-spacing:-0.025em;
      white-space:nowrap;
    }

    body[data-page="space"] .site-header #main-nav {
      display:flex;
      align-items:center;
      gap:4px;
    }

    body[data-page="space"] .site-header #main-nav a {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:9px 13px;
      border-radius:11px;
      color:var(--muted);
      text-decoration:none;
      font-size:.94rem;
      font-weight:700;
      transition:background 160ms ease,color 160ms ease,transform 160ms ease;
    }

    body[data-page="space"] .site-header #main-nav a:first-child,
    body[data-page="space"] .site-header #main-nav a:hover,
    body[data-page="space"] .site-header #main-nav a:focus-visible {
      background:var(--surface-soft);
      color:var(--text);
    }

    body[data-page="space"] .site-header #main-nav a:hover {
      transform:translateY(-1px);
    }

    body[data-page="space"] .space-detail-grid {
      align-items:start;
    }

    /* Imagen principal: más contenida y elegante. */
    body[data-page="space"] .space-detail-image {
      min-height:0;
      width:75%;
      aspect-ratio:4 / 3;
      height:auto;
      margin-inline:auto;
      border-radius:18px;
      overflow:hidden;
      background:#edf1ed;
    }

    body[data-page="space"] .space-detail-image img {
      width:100%;
      height:100%;
      min-height:0;
      object-fit:contain;
      background:#edf1ed;
    }

    /* Miniaturas pequeñas, uniformes y escalables según el número de fotos. */
    body[data-page="space"] .space-gallery {
      display:grid;
      grid-template-columns:repeat(auto-fill,88px);
      justify-content:start;
      gap:8px;
      margin-top:10px;
    }

    body[data-page="space"] .space-gallery-thumb {
      width:88px;
      height:66px;
      aspect-ratio:auto;
      border-radius:10px;
      border:1px solid var(--line);
      transition:border-color 160ms ease,box-shadow 160ms ease,transform 160ms ease;
    }

    body[data-page="space"] .space-gallery-thumb:hover {
      transform:translateY(-1px);
    }

    body[data-page="space"] .space-gallery-thumb.is-active {
      border-color:var(--green);
      box-shadow:0 0 0 2px var(--green-soft);
    }

    /* La información inferior se presenta como una ficha limpia. */
    body[data-page="space"] #space-conditions {
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      column-gap:32px;
      align-items:start;
    }

    body[data-page="space"] .space-conditions-column {
      min-width:0;
    }

    body[data-page="space"] .space-condition-row {
      grid-template-columns:1fr;
      gap:4px;
      padding:14px 0;
    }

    body[data-page="space"] .space-condition-row strong {
      color:var(--muted);
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    body[data-page="space"] .space-condition-row span {
      color:var(--text);
      font-size:.96rem;
    }

    /* =========================================================
       CORRECCIÓN DEFINITIVA DEL MENÚ MÓVIL
       En la versión anterior esta página tenía un display:flex
       demasiado específico que anulaba el menú cerrado de main.css.
    ========================================================= */
    @media (max-width:767px) {
      body[data-page="space"] .site-header #main-nav {
        display:none;
        gap:3px;
      }

      body[data-page="space"] .site-header #main-nav.is-open {
        display:flex;
        flex-direction:column;
        align-items:stretch;
      }

      body[data-page="space"] .site-header #main-nav a {
        min-height:44px;
        width:100%;
      }

      body[data-page="space"] .space-detail-image {
        width:100%;
        aspect-ratio:4 / 3;
        height:auto;
      }

      body[data-page="space"] .space-gallery {
        grid-template-columns:repeat(auto-fill,74px);
        gap:7px;
      }

      body[data-page="space"] .space-gallery-thumb {
        width:74px;
        height:56px;
        border-radius:9px;
      }

      body[data-page="space"] #space-conditions {
        grid-template-columns:1fr;
        column-gap:0;
      }
    }
  </style>

</head>
<body data-page="space">

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="MiEspacioParaCelebrar">
      <span class="brand-mark">MiEspacioParaCelebrar</span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="main-nav">Menú</button>

    <nav id="main-nav" class="nav-links" data-nav aria-label="Navegación principal">
        <a href="espacios.html">Espacios</a>
        <a href="disponibilidad.html">Disponibilidad</a>
        <a href="seguimiento.html">Consultar</a>
        <a href="acceso.html">Área privada</a>
      </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <a class="button button-secondary" href="espacios.html">← Volver a espacios</a>

      <div class="space-detail-grid" style="margin-top:24px;">
        <article class="panel">
          <p class="eyebrow" id="space-location">Cargando ubicación…</p>
          <h1 id="space-name">Cargando espacio…</h1>
          <p id="space-description">Cargando información…</p>
          <p class="price" id="space-price">Consultando precio…</p>

          <div id="space-calendar" class="space-calendar" style="margin-top:24px;">
            <form id="space-availability-form" novalidate>
              <div class="form-grid">
                <div class="form-field date-input-wrap">
                  <label for="space-start-date">Desde</label>
                  <button
                    id="space-start-calendar-button"
                    class="date-input-button"
                    type="button"
                    data-space-calendar-target="start"
                    aria-haspopup="dialog"
                    aria-controls="space-calendar-panel">
                    <span id="space-start-date">Selecciona una fecha</span>
                    <span aria-hidden="true">▾</span>
                  </button>
                </div>

                <div class="form-field date-input-wrap">
                  <label for="space-end-date">Hasta</label>
                  <button
                    id="space-end-calendar-button"
                    class="date-input-button"
                    type="button"
                    data-space-calendar-target="end"
                    aria-haspopup="dialog"
                    aria-controls="space-calendar-panel">
                    <span id="space-end-date">Selecciona una fecha</span>
                    <span aria-hidden="true">▾</span>
                  </button>
                </div>
              </div>

              <div
                id="space-calendar-panel"
                class="calendar-panel"
                role="dialog"
                aria-label="Calendario de disponibilidad"
                hidden></div>

              <div id="space-availability-result" class="notice" hidden aria-live="polite"></div>

              <div class="form-actions" style="margin-top:18px;">
                <a
                  id="space-book-button"
                  class="button button-primary"
                  href="reservar.html"
                  hidden>Solicitar reserva</a>
              </div>
            </form>
          </div>
        </article>

        <article class="card">
          <div class="space-detail-image" id="space-image" aria-live="polite">Cargando imagen…</div>
          <div id="space-gallery" class="space-gallery" aria-label="Galería del espacio"></div>
        </article>
      </div>

      <section class="panel" style="margin-top:24px;">
        <h2>Información del espacio</h2>
        <p id="space-detail-description">Cargando información…</p>
        <div id="space-conditions"></div>
      </section>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© <span data-year></span> MiEspacioParaCelebrar</p>
  </div>
</footer>

<script src="js/app.js?v=20261008-navfix"></script>
</body>
</html>
