<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta un espacio para celebraciones y eventos en MiEspacioParaCelebrar.">
  <title>Espacio · MiEspacioParaCelebrar</title>
  <link rel="stylesheet" href="css/main.css?v=20261007">
  <script src="supabase-config.js?v=20261007"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="space">

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="MiEspacioParaCelebrar">
      <span class="brand-mark">MiEspacioParaCelebrar</span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
      <span class="sr-only">Abrir menú</span>
    </button>

    <nav id="main-nav" data-nav aria-label="Navegación principal">
      <a href="espacios.html">Espacios</a>
      <a href="disponibilidad.html">Disponibilidad</a>
      <a href="seguimiento.html">Consultar</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <a class="button button-secondary" href="espacios.html">← Volver a espacios</a>

      <div class="space-detail-grid" style="margin-top:24px;">
        <article class="card">
          <div class="space-detail-image" id="space-image" aria-live="polite">Cargando imagen…</div>
          <div id="space-gallery" class="space-gallery" aria-label="Galería del espacio"></div>
        </article>

        <article class="panel">
          <p class="eyebrow" id="space-location">Cargando ubicación…</p>
          <h1 id="space-name">Cargando espacio…</h1>
          <p id="space-description">Cargando información…</p>
          <p class="price" id="space-price">Consultando precio…</p>

          <div id="space-calendar" class="space-calendar" style="margin-top:24px;">
            <form id="space-availability-form" novalidate>
              <div class="form-grid">
                <div class="form-field date-input-wrap">
                  <label for="space-start-date">Desde</label>
                  <button
                    id="space-start-calendar-button"
                    class="date-input-button"
                    type="button"
                    data-space-calendar-target="start"
                    aria-haspopup="dialog"
                    aria-controls="space-calendar-panel">
                    <span id="space-start-date">Selecciona una fecha</span>
                    <span aria-hidden="true">▾</span>
                  </button>
                </div>

                <div class="form-field date-input-wrap">
                  <label for="space-end-date">Hasta</label>
                  <button
                    id="space-end-calendar-button"
                    class="date-input-button"
                    type="button"
                    data-space-calendar-target="end"
                    aria-haspopup="dialog"
                    aria-controls="space-calendar-panel">
                    <span id="space-end-date">Selecciona una fecha</span>
                    <span aria-hidden="true">▾</span>
                  </button>
                </div>
              </div>

              <div
                id="space-calendar-panel"
                class="calendar-panel"
                role="dialog"
                aria-label="Calendario de disponibilidad"
                hidden></div>

              <div id="space-availability-result" class="notice" hidden aria-live="polite"></div>

              <div class="form-actions" style="margin-top:18px;">
                <a
                  id="space-book-button"
                  class="button button-primary"
                  href="reservar.html"
                  hidden>Solicitar reserva</a>
              </div>
            </form>
          </div>
        </article>
      </div>

      <section class="panel" style="margin-top:24px;">
        <h2>Información del espacio</h2>
        <p id="space-detail-description">Cargando información…</p>
        <div id="space-conditions"></div>
      </section>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© <span data-year></span> MiEspacioParaCelebrar</p>
  </div>
</footer>

<script src="js/app.js?v=20261007-2"></script>
</body>
</html>
